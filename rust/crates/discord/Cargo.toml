# `discord` -- the Go package `go\internal\discord`: local IPC pipe transport and
# the `SET_ACTIVITY` payload.
#
# `windows-sys` is the raw Win32 FFI the transport needs: `CreateFileW` with
# `FILE_FLAG_OVERLAPPED`, overlapped `ReadFile`/`WriteFile`, `CancelIoEx` and
# `CreateNamedPipeW` for the fake server. `serde` + `serde_json` serialize the
# handshake and the `SET_ACTIVITY` envelope, keeping Go's field order and
# `omitempty` (`skip_serializing_if`).

[package]
name = "discord"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
windows-sys.workspace = true
